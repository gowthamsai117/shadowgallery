<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ShadowGallery</title><link rel="stylesheet" href="{{ url_for('static', filename='css/site.css') }}"></head>
<body><header class="topbar"><a class="brand" href="{{ url_for('main.index') }}">◈ SHADOWGALLERY</a><nav><a href="{{ url_for('main.index') }}">Home</a><a href="{{ url_for('main.documents') }}">Documents</a><a href="{{ url_for('main.upload') }}">Upload</a>{% if username %}<a href="{{ url_for('main.logout') }}">Sign out · {{ username }}</a>{% else %}<a href="{{ url_for('main.login') }}">Sign in</a><a href="{{ url_for('main.register') }}">Register</a>{% endif %}</nav></header><main class="container">{% for message in get_flashed_messages() %}<div class="notice">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main><footer>Internal Media Workspace · Build 0.8.4 · Training environment</footer></body></html>
